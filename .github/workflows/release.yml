name: Release

# Push a tag like `v0.1.0' to publish a release containing only the .sty files
# (no tests, no goldens): the four files individually, plus one zip of all four.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the style files
        run: zip preamble-starkman.zip *.sty
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes preamble-starkman.zip *.sty
