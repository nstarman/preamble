name: Release

# Push a tag like `v0.1.0' to publish a release containing only the .sty files
# (no tests, no goldens) once the test suite passes: the four files individually, plus one zip of all four.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    container: texlive/texlive:TL2025-historic   # keep in sync with ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: l3build check
      - run: ./tools/check-links.sh

  release:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Zip the style files
        run: zip preamble-starkman.zip *.sty
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release may already exist (e.g. created in the web UI when tagging):
        # then just attach the assets to it.
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes preamble-starkman.zip *.sty \
            || gh release upload "$GITHUB_REF_NAME" --clobber preamble-starkman.zip *.sty
