name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Both jobs run inside the same TeX Live image, pinned to a release rather than
# `latest': the golden .tlg files record TeX's log output, which changes between
# TeX Live releases.  The image here, the one in the Makefile, and the TeX that
# generated the goldens must all agree -- currently TeX Live 2025.
#
# The `-historic' tags are frozen with respect to TeX packages (they are rebuilt
# only for base-OS security updates), which is exactly what a golden-file suite
# wants.  To move to a newer release: bump both `container:' lines below and
# TEXLIVE_IMAGE in the Makefile, run `make goldens', and commit the result.
env:
  TEXLIVE_IMAGE: texlive/texlive:TL2025-historic

jobs:
  test:
    name: l3build check
    runs-on: ubuntu-latest
    container: texlive/texlive:TL2025-historic   # keep in sync with TEXLIVE_IMAGE
    steps:
      - uses: actions/checkout@v4

      - name: Run the test suite
        run: l3build check

      # On failure, the .diff files show exactly which log lines changed:
      # far more useful than scrolling the job output.
      - name: Upload failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: l3build-diffs
          path: build/test/*.diff
          if-no-files-found: ignore

  links:
    name: End-to-end link check
    runs-on: ubuntu-latest
    container: texlive/texlive:TL2025-historic   # keep in sync with TEXLIVE_IMAGE
    steps:
      - uses: actions/checkout@v4

      # Asserts on the /URI annotations in a real PDF -- i.e. on the links a
      # reader would actually click, rather than on what \package hands \href.
      - name: Check the links in the compiled PDF
        run: ./tools/check-links.sh
